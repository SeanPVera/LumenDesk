name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version to stamp (defaults to the git tag)"
        required: false
        type: string

permissions:
  contents: read

env:
  PROJECT: LumenDesk.xcodeproj
  SCHEME: LumenDesk

jobs:
  package:
    name: Package macOS app
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # package_macos.sh derives the build number from the commit count
          # and the version from the tag, so the full history has to be here.
          fetch-depth: 0

      - name: Run tests
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE_P12" ]]; then
            echo "No MACOS_CERTIFICATE_P12 secret. Building unsigned."
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/lumendesk-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm -f "$CERT_PATH"

          # Without this codesign blocks on an interactive keychain prompt
          # that no one is there to answer.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          # Prepend rather than replace, so the runner keeps whatever it
          # already had on the search list.
          security list-keychain -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d ' "')

      - name: Write notary API key
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          if [[ -z "$NOTARY_KEY_P8" ]]; then
            echo "No NOTARY_KEY_P8 secret. Skipping notarization."
            exit 0
          fi
          KEY_PATH="$RUNNER_TEMP/notary_key.p8"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "NOTARY_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Package
        id: package
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          ARGS=()
          if [[ -n "$INPUT_VERSION" ]]; then
            ARGS+=(--version "$INPUT_VERSION")
          fi
          ./scripts/package_macos.sh "${ARGS[@]}"

          # Whether the artifact is notarized is what decides the release
          # notes, and only the script knows it.
          echo "mode=$(cat dist/*.mode)" >> "$GITHUB_OUTPUT"

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: LumenDesk-macOS
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.package.outputs.mode }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          DMG="$(ls dist/*.dmg)"
          SHA="$(cat "$DMG".sha256)"

          {
            echo "Install by opening the disk image and dragging **LumenDesk** into Applications."
            echo
            echo "Requires macOS 13 Ventura or later. On first launch, allow the Local Network"
            echo "prompt so discovery can reach your bulbs."
            echo
            if [[ "$MODE" != "notarized" ]]; then
              echo "### This build is not notarized"
              echo
              echo "macOS blocks it on first launch. Clear the download quarantine once,"
              echo "after dragging the app into Applications:"
              echo
              echo "\`\`\`sh"
              echo "xattr -dr com.apple.quarantine /Applications/LumenDesk.app"
              echo "\`\`\`"
              echo
              echo "To click instead of typing: on Ventura and Sonoma, Control-click the app"
              echo "and choose Open. Sequoia removed that shortcut, so let the first launch"
              echo "get blocked, then use System Settings > Privacy & Security > Open Anyway."
              echo
            fi

            if [[ "$MODE" == "unsigned" ]]; then
              echo "This build is ad-hoc signed, so macOS sees each release as a different"
              echo "app and forgets its Screen Recording and Local Network approvals. Expect"
              echo "to grant both again after updating."
              echo
            fi
            echo "\`\`\`"
            echo "sha256  $SHA"
            echo "\`\`\`"
          } > "$RUNNER_TEMP/notes.md"

          gh release create "$TAG" \
            --title "LumenDesk $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            "$DMG" "$DMG.sha256"

      - name: Clean up keychain
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "${NOTARY_KEY_PATH:-}"
