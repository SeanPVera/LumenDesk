name: LumenDesk
options:
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
  createIntermediateGroups: true
attributes:
  LastUpgradeCheck: "2700"
  LastSwiftUpdateCheck: "2700"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "SW2N54YNK3"
    CODE_SIGN_STYLE: Automatic
    # Modern signing identity name; without this xcodegen emits the legacy
    # "iPhone Developer" string into the regenerated project.
    CODE_SIGN_IDENTITY: "Apple Development"
targets:
  LumenDesk:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: LumenDesk
        excludes:
          - Resources/Fonts
      - path: LumenDesk/Resources/Fonts
        type: folder
        buildPhase: resources
    info:
      path: LumenDesk/Info.plist
      properties:
        CFBundleDisplayName: LumenDesk
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: "Copyright © 2026 SeanPVera"
        UIAppFonts:
          - Fonts/DejaVuSansCondensed.ttf
          - Fonts/DejaVuSansCondensed-Bold.ttf
          - Fonts/OpenSans-Regular.ttf
          - Fonts/OpenSans-Semibold.ttf
        ATSApplicationFontsPath: Fonts
        NSLocalNetworkUsageDescription: LumenDesk discovers and controls LIFX, Govee, and Nanoleaf Shapes lights on your local network.
        NSMicrophoneUsageDescription: LumenDesk analyzes microphone audio locally to drive a Live room response. Audio is not retained.
        NSScreenCaptureUsageDescription: LumenDesk analyzes system audio locally to drive a Live room response. Audio is not retained.
        NSBonjourServices:
          - _lifx._udp
          - _hap._tcp
          - _nanoleafapi._tcp
          - _nanoleafms._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: Brotli
    settings:
      base:
        # Set explicitly so xcodegen does not inject the legacy
        # "iPhone Developer" identity into the application target.
        CODE_SIGN_IDENTITY: "Apple Development"
        # Settings the hand-maintained project carried that xcodegen does not
        # emit by default; kept so regeneration does not regress them.
        DEAD_CODE_STRIPPING: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]":
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: com.lumendesk.LumenDesk
        # Info.plist reads both through $(...), so a release build can
        # override them on the xcodebuild command line without editing
        # tracked files. Keep them here or regeneration drops them and
        # the bundle ships an empty version string.
        MARKETING_VERSION: "2.1"
        CURRENT_PROJECT_VERSION: "291"
        # The sandbox entitlements only exist on macOS; iOS device builds are
        # signed without an entitlements file (Local Network needs none).
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: LumenDesk/LumenDesk.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_ASSET_PATHS: '"Preview Content"'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: LumenDesk/BrotliBridge.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/brotli/c/include"
      configs:
        Debug:
          # Test builds should not become candidates for macOS permission-
          # driven relaunches. Music Mode registers the currently running
          # bundle immediately before requesting Screen Recording access.
          REGISTER_WITH_LAUNCH_SERVICES[sdk=macosx*]: NO
  Brotli:
    # Vendored Brotli C sources (MIT; see Vendor/brotli/LICENSE), for the
    # iLightShow bundle decoder. Taken from upstream google/brotli; the
    # dec/ + common/ tree is what production uses, enc/ is DEBUG-only (tests).
    type: library.static
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Vendor/brotli/c/common
        excludes:
          - dictionary.bin
          - dictionary.bin.br
      - path: Vendor/brotli/c/dec
      - path: Vendor/brotli/c/enc
        excludes:
          # C++ lazy-init variant; the default (BROTLI_STATIC_INIT_NONE)
          # uses enc_static_init.c alone.
          - static_init_lazy.cc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumendesk.brotli
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/brotli/c"
          - "$(SRCROOT)/Vendor/brotli/c/include"
        CLANG_C_LANGUAGE_STANDARD: c11
        SKIP_INSTALL: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: NO
  LumenDeskTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: LumenDeskTests
    dependencies:
      - target: LumenDesk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumendesk.LumenDeskTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        # xcodegen's default TEST_HOST is the iOS bundle layout; macOS apps
        # keep the binary under Contents/MacOS. Set it explicitly or the
        # test target fails with "Could not find test host".
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LumenDesk.app/Contents/MacOS/LumenDesk"
        SWIFT_OBJC_BRIDGING_HEADER: LumenDeskTests/BrotliBridge.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/brotli/c/include"
schemes:
  LumenDesk:
    build:
      targets:
        LumenDesk: all
        # Only the test action, so Run/Profile/Archive/Analyze of this scheme
        # do not try to build the macOS-only test target.
        LumenDeskTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # Keep the parallel test run main's scheme had; xcodegen otherwise
      # defaults a single test target to non-parallel.
      targets:
        - name: LumenDeskTests
          parallelizable: true
    analyze:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
