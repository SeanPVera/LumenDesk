name: LumenDesk
options:
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "SW2N54YNK3"
    CODE_SIGN_STYLE: Automatic
targets:
  LumenDesk:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: LumenDesk
    info:
      path: LumenDesk/Info.plist
      properties:
        CFBundleDisplayName: LumenDesk
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: "Copyright © 2026 SeanPVera"
        NSLocalNetworkUsageDescription: LumenDesk discovers and controls LIFX and Govee smart bulbs on your local network.
        NSMicrophoneUsageDescription: LumenDesk analyzes music and room audio levels locally to animate music-reactive lighting effects.
        NSScreenCaptureUsageDescription: LumenDesk can capture system audio from music apps locally to drive music-reactive lightshows.
        NSBonjourServices:
          - _lifx._udp
          - _hap._tcp
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumendesk.LumenDesk
        # Info.plist reads both through $(...), so a release build can
        # override them on the xcodebuild command line without editing
        # tracked files. Keep them here or regeneration drops them and
        # the bundle ships an empty version string.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # The sandbox entitlements only exist on macOS; iOS device builds are
        # signed without an entitlements file (Local Network needs none).
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: LumenDesk/LumenDesk.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_ASSET_PATHS: '"Preview Content"'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          # Test builds should not become candidates for macOS permission-
          # driven relaunches. Music Mode registers the currently running
          # bundle immediately before requesting Screen Recording access.
          REGISTER_WITH_LAUNCH_SERVICES[sdk=macosx*]: NO
  LumenDeskTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: LumenDeskTests
    dependencies:
      - target: LumenDesk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumendesk.LumenDeskTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
